services:
  - type: web
    name: legendary-ban
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ADMIN_PASSWORD
        value: IFEJESU88
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /opt/render/project/data/wareport.db
      - key: SESSIONS_DIR
        value: /opt/render/project/data/sessions
    disk:
      name: wareport-data
      mountPath: /opt/render/project/data
      sizeGB: 1
